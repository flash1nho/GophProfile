apiVersion: batch/v1
kind: Job
metadata:
  name: gophprofile-migrations

  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: ghcr.io/your-org/gophprofile:latest

          command:
            - ./migrate
