apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "gophprofile.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: gophprofile
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        env:
        {{- toYaml .Values.env | nindent 12 }}

        envFrom:
        - configMapRef:
            name: {{ include "gophprofile.fullname" . }}
        - secretRef:
            name: {{ include "gophprofile.fullname" . }}

        resources:
          {{- toYaml .Values.resources | nindent 12 }}

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
