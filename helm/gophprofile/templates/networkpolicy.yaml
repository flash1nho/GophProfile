apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  # Allow ingress from ingress controller only
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8080
      - protocol: TCP
        port: 9090

  # Restrict egress to necessary services
  egress:
    # DNS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53

    # PostgreSQL
    {{- if .Values.postgresql.enabled }}
    - to:
      - podSelector:
          matchLabels:
            app: postgres
      ports:
      - protocol: TCP
        port: 5432
    {{- end }}

    # RabbitMQ
    {{- if .Values.rabbitmq.enabled }}
    - to:
      - podSelector:
          matchLabels:
            app: rabbitmq
      ports:
      - protocol: TCP
        port: 5672
    {{- end }}

    # MinIO
    {{- if .Values.minio.enabled }}
    - to:
      - podSelector:
          matchLabels:
            app: minio
      ports:
      - protocol: TCP
        port: 9000
    {{- end }}

    # External HTTPS (for external registries, etc)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

    # External DNS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53
