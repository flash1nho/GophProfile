apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}

type: Opaque

{{- if .Values.secrets }}
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- else }}
data:
  # These should be set via helm --set or values file during deployment
  POSTGRES_USER: {{ .Values.postgresql.user | default "gophprofile" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | default "changeme" | b64enc | quote }}

  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.user | default "guest" | b64enc | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | default "guest" | b64enc | quote }}

  MINIO_ROOT_USER: {{ .Values.minio.user | default "minioadmin" | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.password | default "minioadmin" | b64enc | quote }}

  S3_KEY: {{ .Values.s3.key | default "minioadmin" | b64enc | quote }}
  S3_SECRET: {{ .Values.s3.secret | default "minioadmin" | b64enc | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | default "avatars" | b64enc | quote }}
{{- end }}
