replicaCount: 2

image:
  repository: flash1nho/gophprofile
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: gophprofile.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env: []

postgresql:
  enabled: false
  host: postgres
  port: 5432
  database: gophprofile
  user: gophprofile
  password: "changeme"

rabbitmq:
  enabled: false
  host: rabbitmq
  port: 5672
  user: guest
  password: guest

minio:
  enabled: false
  endpoint: minio:9000
  bucket: avatars
  user: minioadmin
  password: minioadmin

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

podDisruptionBudget:
  minAvailable: 1

terminationGracePeriodSeconds: 30
