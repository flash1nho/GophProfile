replicaCount: 2

image:
  repository: ghcr.io/your-org/gophprofile
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 200m
    memory: 256Mi

  limits:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80

ingress:
  enabled: true
  className: nginx

  hosts:
    - host: gophprofile.local
      paths:
        - path: /
          pathType: Prefix

monitoring:
  serviceMonitor:
    enabled: true

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
