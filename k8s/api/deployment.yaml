apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-api
  namespace: gophprofile
  labels:
    app: gophprofile-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: gophprofile-api

  template:
    metadata:
      labels:
        app: gophprofile-api

    spec:
      serviceAccountName: gophprofile-api
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gophprofile-api

      containers:
        - name: api
          image: ghcr.io/your-org/gophprofile:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

            - name: metrics
              containerPort: 9090

          envFrom:
            - configMapRef:
                name: gophprofile-api

            - secretRef:
                name: gophprofile-api

          resources:
            requests:
              cpu: 200m
              memory: 256Mi

            limits:
              cpu: 1000m
              memory: 1024Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 10
